name: Windows compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 30
    # NOV-65: ningún test puede omitirse por herramienta ausente.
    env:
      REGULUS_STRICT_ENV: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: Build all platforms
        run: |
          go build ./...
          go build -o bin/regulus.exe ./cmd/regulus
      - name: Vet
        run: go vet ./internal/gates ./internal/httpapi ./internal/doctor ./internal/contract ./internal/mcp
      - name: Native tests (no shell assumption)
        run: |
          go test ./internal/httpapi -count=1
          go test ./internal/doctor ./internal/contract ./internal/mcp -count=1
      - name: Structured runner tests (no sh.exe/bash.exe)
        run: |
          go test -c -o $env:TEMP/gates.test.exe ./internal/gates
          & $env:TEMP/gates.test.exe -test.run 'TestStructuredRunner' -test.count=1 -test.v
      - name: Validate artifacts + hashes
        run: |
          Get-FileHash bin/regulus.exe -Algorithm SHA256
          Get-AuthenticodeSignature bin/regulus.exe | Format-List Status
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: .regulus/evidence/
          retention-days: 30
          if-no-files-found: warn

  windows-protected-audit:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Audit policy state (not enforcement)
        run: |
          Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 5 | Format-Table TimeCreated, Id -AutoSize || echo "no CodeIntegrity log access"
          echo "Standard GitHub runner is NOT Smart App Control enforced. Protected validation requires lab VM (see docs/windows-diagnosis.md). Audit only, never confuses audit with enforcement."
