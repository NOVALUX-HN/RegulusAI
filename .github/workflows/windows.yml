name: Windows compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  windows-native:
    runs-on: windows-2022
    timeout-minutes: 30
    # NOV-65: ningún test puede omitirse por herramienta ausente.
    env:
      REGULUS_STRICT_ENV: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false
      - name: Build all platforms
        run: |
          go build ./...
          go build -o bin/regulus.exe ./cmd/regulus
      - name: Vet
        run: go vet ./internal/gates ./internal/httpapi ./internal/doctor ./internal/contract ./internal/mcp
      - name: Full suite via workspace runner (NOV-66)
        shell: powershell
        run: |
          powershell -NoProfile -File scripts/test-windows.ps1
      - name: Validate artifacts + hashes
        shell: powershell
        run: |
          $h = Get-FileHash bin/regulus.exe -Algorithm SHA256
          $h.Hash | Out-File -FilePath bin.regulus.sha256 -NoNewline
          Get-Content bin.regulus.sha256
          if ($h.Hash.Length -ne 64) { throw "hash inesperado" }
      - name: Authenticode stays NotSigned while optional (NOV-44)
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature bin/regulus.exe
          $sig | Format-List Status, SignerCertificate
          if ($sig.Status -ne 'NotSigned') { throw "se esperaba NotSigned mientras la firma es opcional, got $($sig.Status)" }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: .regulus/evidence/
          retention-days: 30
          if-no-files-found: warn

  windows-protected-audit:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Audit policy state (not enforcement)
        run: |
          Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 20 | Format-Table TimeCreated, Id -AutoSize | Out-File -FilePath audit-codeintegrity.txt
          Get-Content audit-codeintegrity.txt
          echo "Standard GitHub runner is NOT Smart App Control enforced. Protected validation requires lab VM (see docs/windows-diagnosis.md). Audit only, never confuses audit with enforcement."
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-audit-evidence
          path: audit-codeintegrity.txt
          retention-days: 90
          if-no-files-found: warn
