# Perf baselines (NOV-79 Paso 58)
#
# Weekly + manual comparison of Go benchmarks against the versioned
# baseline in bench/perf-baseline.json (per-benchmark max_regression
# ratio, fail-closed). Reports publish as artifacts; the JSON is only
# regenerated intentionally (scripts/perf-check.sh --update) and
# committed as its own change. benchstat multi-rep statistics is the
# documented next step once runs establish variability bands.

name: Perf baselines

on:
  schedule:
    - cron: "47 3 * * 0"
  workflow_dispatch:

# NOV-83: least privilege by default.
permissions:
  contents: read

jobs:
  perf-compare:
    name: Perf compare
    # NOV-83: report upload needs actions:write under the read-only default.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Compare benchmarks against baseline
        run: bash scripts/perf-check.sh --report perf-report.md

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-report
          path: perf-report.md
          retention-days: 90
          if-no-files-found: warn
