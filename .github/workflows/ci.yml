# CI — el flujo ordenado de Regulus en un solo workflow.
#
# Antes: gauntlet.yml (Linux, 16 capas) + windows.yml (suite nativa +
# auditoría) por separado; ahora un solo lugar para monitorear el flujo
# paso por paso (jobs en orden de archivo) y replicarlo local antes de
# cada commit (ver docs/windows-full-suite.md § Paridad local ↔ CI:
# `gate run ci/push` + `scripts/test-windows.ps1`).
#
# fuzz.yml, host-conformity.yml y release.yml quedan aparte: tienen
# triggers propios (schedule/manual) y no son parte del flujo por push.
#
# Convención de checks: los job ids se preservan (gauntlet,
# windows-native, windows-protected-audit) para no romper reglas de
# rama que referencien contextos; el job name fija el título visible.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gauntlet:
    name: Gauntlet
    # S2 (docs-ci-hygiene/C2): job acotado — `timeout-minutes` cubre el
    # gate (~4min) con margen; runner pineado en vez de `latest` flotante.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # NOV-65: ningún test puede omitirse por herramienta ausente;
    # con STRICT=1 el skip se convierte en fallo.
    env:
      REGULUS_STRICT_ENV: "1"
    # the receipts-trail commit (S8) writes docs/EVIDENCE.md back to main
    permissions:
      contents: write
    steps:
      # S4: actions stay on vendor-maintained major tags (checkout v5,
      # setup-go v6 with go 1.27, setup-bun v2) — GitHub/Oven keep these
      # majors backwards-compatible, so a floating major is intentional here.
      # Exact pins are required only for the Go tool installs below.
      # S2 (docs-ci-hygiene/C2): checkout v4 -> v5 y setup-go v5 -> v6
      # porque los majors viejos corren en node20 (aviso de deprecación) y
      # los nuevos en node24 (verificado 2026-11-01 en sus action.yml).
      # setup-bun@v2 ya corre en node24, se queda.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          # Zero-dep module (no go.sum by invariant TestZeroDepsGoMod):
          # default cache restore warns on every run, so opt out.
          cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Typecheck the plugin
        working-directory: .opencode
        run: |
          bun install
          bunx tsc --noEmit

      - name: Test the plugin domain logic
        working-directory: .opencode
        run: bun test ./lib/

      - name: Smoke the new CLI surface
        run: |
          go build -o bin/regulus ./cmd/regulus
          tmp=$(mktemp -d)
          cd "$tmp"
          "$OLDPWD/bin/regulus" evolve propose --task demo/T1 --domain go 2>&1 | grep -q "no evidence" || (echo "evolve refusal smoke failed"; exit 1)
          "$OLDPWD/bin/regulus" skills list
          "$OLDPWD/bin/regulus" trace files --session nobody | grep -q "no trace" || (echo "trace files smoke failed"; exit 1)
          "$OLDPWD/bin/regulus" probe contrast --task demo/T1 --gate missing 2>&1 | grep -q . || (echo "probe usage smoke failed"; exit 1)

      - name: Run the gauntlet (16 layers, receipts)
        run: |
          go build -o bin/regulus ./cmd/regulus
          # Non-interactive CI cannot create .regulus/trusted (explicit operator
          # action only, never a gate); consent is explicit here instead.
          # See docs/trust.md: scripts must pass --yes (no interactive fallback).
          bin/regulus gate run --yes ci/push

      # S8 retired (open source): the receipts trail is no longer committed
      # into docs/EVIDENCE.md. Gate receipts stay available as CI artifacts
      # (next step) and locally via `regulus evidence list --task <t>`.

      # S4: un gate rojo deja evidencia — sube los receipts siempre,
      # incluso en fallo, para diagnóstico sin adivinar.
      # S2 (docs-ci-hygiene/C2): upload-artifact se queda en v4 a propósito:
      # v5 también declara `using: node20` (verificado 2026-11-01 y de nuevo
      # 2026-11-15: ambos action.yml idénticos) — subir de major no saca el
      # aviso de deprecación, solo añade churn. El warning "forced to run
      # on Node.js 24" lo emite el runner y desaparece solo cuando GitHub
      # migre la action a node24.
      # warn (no error) si no hay ficheros: capas tempranas pueden no
      # dejar receipts del task si falla typecheck.
      - name: Upload gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: .regulus/evidence/ci__push/
          retention-days: 30
          if-no-files-found: warn

  windows-native:
    name: Windows compatibility
    runs-on: windows-2022
    timeout-minutes: 30
    # NOV-65: ningún test puede omitirse por herramienta ausente;
    # con STRICT=1 el skip se convierte en fallo.
    env:
      REGULUS_STRICT_ENV: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: false

      # NOV-65: strict env turns a missing-tool skip into a failure, so
      # the tools the suite needs must be installed (same pins as the
      # gauntlet job): gremlins for the journey mutation gate tests.
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Build all platforms
        run: |
          go build ./...
          go build -o bin/regulus.exe ./cmd/regulus

      - name: Vet
        run: go vet ./internal/gates ./internal/httpapi ./internal/doctor ./internal/contract ./internal/mcp

      - name: Full suite via workspace runner (NOV-66)
        shell: powershell
        run: |
          powershell -NoProfile -File scripts/test-windows.ps1

      - name: Validate artifacts + hashes
        shell: powershell
        run: |
          $h = Get-FileHash bin/regulus.exe -Algorithm SHA256
          $h.Hash | Out-File -FilePath bin.regulus.sha256 -NoNewline
          Get-Content bin.regulus.sha256
          if ($h.Hash.Length -ne 64) { throw "hash inesperado" }

      - name: Authenticode stays NotSigned while optional (NOV-44)
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature bin/regulus.exe
          $sig | Format-List Status, SignerCertificate
          if ($sig.Status -ne 'NotSigned') { throw "se esperaba NotSigned mientras la firma es opcional, got $($sig.Status)" }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: .regulus/evidence/
          retention-days: 30
          if-no-files-found: warn

  windows-protected-audit:
    name: Windows protected audit
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Audit policy state (not enforcement)
        run: |
          Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 20 | Format-Table TimeCreated, Id -AutoSize | Out-File -FilePath audit-codeintegrity.txt
          Get-Content audit-codeintegrity.txt
          echo "Standard GitHub runner is NOT Smart App Control enforced. Protected validation requires lab VM (see docs/windows-diagnosis.md). Audit only, never confuses audit with enforcement."
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-audit-evidence
          path: audit-codeintegrity.txt
          retention-days: 90
          if-no-files-found: warn
