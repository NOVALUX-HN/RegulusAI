name: Gauntlet

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gauntlet:
    # S2 (docs-ci-hygiene/C2): job acotado — `timeout-minutes` cubre el
    # gate (~4min) con margen; runner pineado en vez de `latest` flotante.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # the receipts-trail commit (S8) writes docs/EVIDENCE.md back to main
    permissions:
      contents: write
    steps:
      # S4: actions stay on vendor-maintained major tags (checkout v5,
      # setup-go v6 with go 1.27, setup-bun v2) — GitHub/Oven keep these
      # majors backwards-compatible, so a floating major is intentional here.
      # Exact pins are required only for the Go tool installs below.
      # S2 (docs-ci-hygiene/C2): checkout v4 -> v5 y setup-go v5 -> v6
      # porque los majors viejos corren en node20 (aviso de deprecación) y
      # los nuevos en node24 (verificado 2026-11-01 en sus action.yml).
      # setup-bun@v2 ya corre en node24, se queda.
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          # Zero-dep module (no go.sum by invariant TestZeroDepsGoMod):
          # default cache restore warns on every run, so opt out.
          cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Typecheck the plugin
        working-directory: .opencode
        run: |
          bun install
          bunx tsc --noEmit

      - name: Test the plugin domain logic
        working-directory: .opencode
        run: bun test ./lib/

      - name: Smoke the new CLI surface
        run: |
          go build -o bin/regulus ./cmd/regulus
          tmp=$(mktemp -d)
          cd "$tmp"
          "$OLDPWD/bin/regulus" evolve propose --task demo/T1 --domain go 2>&1 | grep -q "no evidence" || (echo "evolve refusal smoke failed"; exit 1)
          "$OLDPWD/bin/regulus" skills list
          "$OLDPWD/bin/regulus" trace files --session nobody | grep -q "no trace" || (echo "trace files smoke failed"; exit 1)
          "$OLDPWD/bin/regulus" probe contrast --task demo/T1 --gate missing 2>&1 | grep -q . || (echo "probe usage smoke failed"; exit 1)

      - name: Run the gauntlet (12 layers, receipts)
        run: |
          go build -o bin/regulus ./cmd/regulus
          bin/regulus gate run ci/push

      # S8 retired (open source): the receipts trail is no longer committed
      # into docs/EVIDENCE.md. Gate receipts stay available as CI artifacts
      # (next step) and locally via `regulus evidence list --task <t>`.

      # S4: un gate rojo deja evidencia — sube los receipts siempre,
      # incluso en fallo, para diagnóstico sin adivinar.
      # S2 (docs-ci-hygiene/C2): upload-artifact se queda en v4 a propósito:
      # v5 también declara `using: node20` (verificado 2026-11-01) — hoy no
      # existe un major con node24 al que subir, y cambiar de major sin
      # beneficio solo añade churn.
      # warn (no error) si no hay ficheros: capas tempranas pueden no
      # dejar receipts del task si falla typecheck.
      - name: Upload gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: .regulus/evidence/ci__push/
          retention-days: 30
          if-no-files-found: warn
