name: Gauntlet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gauntlet:
    runs-on: ubuntu-latest
    # the receipts-trail commit (S8) writes docs/EVIDENCE.md back to main
    permissions:
      contents: write
    steps:
      # S4: actions stay on vendor-maintained major tags (checkout v4, setup-go v5
      # with go 1.27, setup-bun v2) — GitHub/Oven keep these majors
      # backwards-compatible, so a floating major is intentional here.
      # Exact pins are required only for the Go tool installs below.
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          # Zero-dep module (no go.sum by invariant TestZeroDepsGoMod):
          # default cache restore warns on every run, so opt out.
          cache: false

      - uses: oven-sh/setup-bun@v2

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Typecheck the plugin
        working-directory: .opencode
        run: |
          bun install
          bunx tsc --noEmit

      - name: Test the plugin domain logic
        working-directory: .opencode
        run: bun test ./lib/

      - name: Smoke the new CLI surface
        run: |
          go build -o bin/regulus ./cmd/regulus
          tmp=$(mktemp -d)
          cd "$tmp"
          "$OLDPWD/bin/regulus" evolve propose --task demo/T1 --domain go 2>&1 | grep -q "no evidence" || (echo "evolve refusal smoke failed"; exit 1)
          "$OLDPWD/bin/regulus" skills list
          "$OLDPWD/bin/regulus" trace files --session nobody | grep -q "no trace" || (echo "trace files smoke failed"; exit 1)
          "$OLDPWD/bin/regulus" probe contrast --task demo/T1 --gate missing 2>&1 | grep -q . || (echo "probe usage smoke failed"; exit 1)

      - name: Run the gauntlet (12 layers, receipts)
        run: |
          go build -o bin/regulus ./cmd/regulus
          bin/regulus gate run ci/push

      # S8: the committed repository must carry its own receipts trail.
      # Idempotent: renders `evidence list --task ci/push` after a green
      # gauntlet and commits only when the content changed, as
      # github-actions[bot] with [skip ci] so the commit cannot loop.
      - name: Commit the receipts trail into docs/EVIDENCE.md [skip ci]
        if: success() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "# CI evidence — receipts trail"
            echo
            echo 'Regenerated by .github/workflows/gauntlet.yml from `regulus evidence list --task ci/push` after a green gauntlet. The append-only receipts live under `.regulus/evidence/`; this page is the committed, auditable view.'
            echo
            echo '```'
            bin/regulus evidence list --task ci/push
            echo '```'
          } > docs/EVIDENCE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EVIDENCE.md
          if git diff --cached --quiet; then
            echo "docs/EVIDENCE.md unchanged — nothing to commit"
          else
            git commit -m "docs(ci): regenerate EVIDENCE receipts trail [skip ci]"
            git push
          fi

      # S4: un gate rojo deja evidencia — sube los receipts siempre,
      # incluso en fallo, para diagnóstico sin adivinar. v4 coherente
      # con checkout@v4 (majors vendor intencionales, ver nota S4 arriba);
      # v5 no verificado como major vigente, no se adopta.
      # warn (no error) si no hay ficheros: capas tempranas pueden no
      # dejar receipts del task si falla typecheck.
      - name: Upload gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: .regulus/evidence/ci__push/
          retention-days: 7
          if-no-files-found: warn
