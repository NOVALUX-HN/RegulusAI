# Fuzzing acotado (NOV-65)
#
# Seis superficies con fuzz nativo de Go y corpus semilla versionado.
# `go test` ejecuta solo el corpus (rápido, determinista); este workflow
# corre cada target 60 segundos semanales. Cada crasher se convierte en
# un test de regresión permanente antes de cerrar el issue.

name: Fuzzing acotado

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

# NOV-83: least privilege by default.
permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Fuzz gates allowlist + segmentation
        run: go test ./internal/gates/ -run XXX -fuzz 'FuzzAllowedByAllowlist|FuzzClassifySegments' -fuzztime 60s .
      - name: Fuzz spec GWT parser
        run: go test ./internal/spec/ -run XXX -fuzz FuzzCheck -fuzztime 60s .
      - name: Fuzz almanac import
        run: go test ./internal/almanac/ -run XXX -fuzz FuzzImport -fuzztime 60s .
      - name: Fuzz MCP framing
        run: go test ./internal/cli/ -run XXX -fuzz 'FuzzHandleMCPLine|FuzzMcpIntRejectsFractions' -fuzztime 60s .
      - name: Fuzz receipts + manifest decode
        run: go test ./internal/receipts/ ./internal/manifest/ -run XXX -fuzz FuzzReadFile -fuzztime 60s .
