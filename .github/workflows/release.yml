# Release verificable (NOV-70)
#
# Tag v* -> matriz 6 targets -> checksums -> provenance (SLSA via
# attestación de GitHub) -> Release con notas de CHANGELOG -> verificación
# del publicado (contract, doctor, journey mínimo). Windows queda
# explícitamente NotSigned (NOV-44: Authenticode opcional, sin
# autofirmados como confianza).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# NOV-83: least privilege by default; each job below declares only
# what it needs instead of one blanket write block.
permissions:
  contents: read

jobs:
  build:
    # NOV-83: attest needs id-token + attestations; binary upload needs
    # actions:write. Checkout is covered by the top-level read.
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: write
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27"
          cache: false
      - name: Goversioninfo resources (Windows only)
        if: matrix.goos == 'windows'
        # NOV-95 (F11.9): fail closed — a silent version-resource drop
        # would ship Windows binaries without version info. No `|| true`.
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
          goversioninfo -64 -o cmd/regulus/resource_windows_amd64.syso versioninfo.json
          goversioninfo -arm -64 -o cmd/regulus/resource_windows_arm64.syso versioninfo.json
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "regulus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/regulus
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "regulus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "regulus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # NOV-83: publishing the release needs contents:write; fetching the
    # built binaries needs actions:read. No id-token here (attestation
    # already happened in build).
    # NOV-95 (F11.9): publish only on version tags. A manual
    # workflow_dispatch run exercises build (dry-run artifacts) but must
    # never cut or overwrite a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum regulus-* > checksums.txt
          cat checksums.txt
      - name: Notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # NOV-95 (F11.9): prefix match — CHANGELOG heads carry a date
          # suffix (`## [X.Y.Z] - DATE`), so exact-line `$0==v` never
          # matched and notes shipped empty. `index()==1` fixes it.
          awk -v v="## [$VERSION]" 'index($0,v)==1{p=1; print; next} p&&/^## \[/{exit} p{print}' CHANGELOG.md > release-notes.md
          cat release-notes.md
          # NOV-95 (F11.9): fail closed — an undocumented version must
          # never publish with empty notes.
          test -s release-notes.md || (echo "no CHANGELOG entry for $VERSION" >&2; exit 1)
      # NOV-83: third-party release action kept but SHA-pinned; replacing
      # it with `gh release` (or verified own steps) is a separate tested
      # change, deferred on purpose.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/regulus-*
            dist/checksums.txt
          body_path: release-notes.md
          draft: false
          prerelease: false

  verify-published:
    # NOV-83: read-only verification (download + checks).
    permissions:
      contents: read
    needs: release
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # NOV-83: third-party downloader kept but SHA-pinned; same
      # deferral rationale as the publisher above.
      - name: Download release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1
        with:
          tag: ${{ github.ref_name }}
          fileName: "regulus-*"
          out-file-path: dl
      - name: Verify checksums
        shell: bash
        run: |
          cd dl
          sha256sum -c checksums.txt
      - name: Contract and doctor
        shell: bash
        run: |
          BIN=""
          for f in dl/regulus-*; do case "$f" in *checksums*) continue;; *) BIN="$f"; break;; esac; done
          chmod +x "$BIN" || true
          "$BIN" contract
          "$BIN" doctor || true
      - name: Windows stays unsigned (NOV-44)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bin = Get-ChildItem dl/regulus-windows-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $bin.FullName
          if ($sig.Status -ne 'NotSigned') { throw "expected NotSigned while signing stays optional, got $($sig.Status)" }
      - name: Minimal journey on published binary
        shell: bash
        run: |
          BIN=""
          for f in dl/regulus-*; do case "$f" in *checksums*) continue;; *) BIN="$f"; break;; esac; done
          chmod +x "$BIN" || true
          rm -rf /tmp/pubjourney && mkdir -p /tmp/pubjourney && cd /tmp/pubjourney
          "$OLDPWD/$BIN" init --stack smoke --force
          printf '%s\n' '# demo' '' 'Domain: demo' 'Class: STANDARD' '' '## Contract' '' '- Objective: smoke' '- Scope: fixture work' '- Acceptance: trivial' '- Verification: gate' '' '## Acceptance' '' '### Scenario: trivial' '' '- Given a fixture' '- When the journey runs' '- Then it passes' '' '## Tasks' '' '| ID | Spec | Work | Route | Depends | Status |' '|----|------|-------|---------|--------|------|' '| T1 | trivial | build | inline | - | todo |' '' '## Log' '' '- L1: journey.' > charts/demo.md
          "$OLDPWD/$BIN" gate run --yes demo/T1
          "$OLDPWD/$BIN" task close charts/demo.md T1
