name: Docs
description: Guides, references, or examples (no security content here — use a private advisory, see SECURITY.md).
labels: [docs]
body:
  - type: input
    id: area
    attributes:
      label: Doc area (guide / reference / example)
  - type: textarea
    id: change
    attributes:
      label: What changes and why
    validations:
      required: true
  - type: checkboxes
    id: drift
    attributes:
      label: Docs-drift check
      options:
        - label: Commands quoted verbatim from `usage` output
        - label: No frozen (H10) document modified
